version: '3.8'

services:
  node1:
    build: .
    container_name: paxos_node1
    command: python -u node/main.py --id 1 --port 8001 --peers paxos_node2:8002,paxos_node3:8003
    ports:
      - "8001:8001"
    networks:
      - paxos-net

  node2:
    build: .
    container_name: paxos_node2
    command: python -u node/main.py --id 2 --port 8002 --peers paxos_node1:8001,paxos_node3:8003
    ports:
      - "8002:8002"
    networks:
      - paxos-net

  node3:
    build: .
    container_name: paxos_node3
    command: python -u node/main.py --id 3 --port 8003 --peers paxos_node1:8001,paxos_node2:8002
    ports:
      - "8003:8003"
    networks:
      - paxos-net

networks:
  paxos-net:
    driver: bridge
