version: '3.8'

services:
  node1:
    build: .
    container_name: paxos_node1
    command: python -u node/server.py --id 1 --port 8001 --peers paxos_node2:8002,paxos_node3:8003
    ports:
      - "8001:8001"
    volumes:
      - node1_data:/app/data
    networks:
      - paxos-net

  node2:
    build: .
    container_name: paxos_node2
    command: python -u node/server.py --id 2 --port 8002 --peers paxos_node1:8001,paxos_node3:8003
    ports:
      - "8002:8002"
    volumes:
      - node2_data:/app/data
    networks:
      - paxos-net

  node3:
    build: .
    container_name: paxos_node3
    command: python -u node/server.py --id 3 --port 8003 --peers paxos_node1:8001,paxos_node2:8002
    ports:
      - "8003:8003"
    volumes:
      - node3_data:/app/data
    networks:
      - paxos-net

volumes:
  node1_data:
    key: null
  node2_data:
    key: null
  node3_data:
    key: null

networks:
  paxos-net:
    driver: bridge
